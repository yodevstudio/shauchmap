name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-build:
    name: Analyze & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Injects a sterile mockup architecture on the fly so the build runner passes the hidden file check
      - name: Create dummy configuration placeholders
        run: |
          mkdir -p lib
          echo "import 'package:firebase_core/firebase_core.dart';" > lib/firebase_options.dart
          echo "class DefaultFirebaseOptions { static FirebaseOptions get currentPlatform => const FirebaseOptions(apiKey: 'mock', appId: 'mock', messagingSenderId: 'mock', projectId: 'mock'); }" >> lib/firebase_options.dart
          touch .env

      - name: Analyze
        run: flutter analyze

      # Build a debug APK to prove the app compiles.
      # A dummy Places key is fine for a compile check — no real key is needed in CI.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=PLACES_API_KEY=ci_dummy_key