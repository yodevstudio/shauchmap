name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-build:
    name: Analyze & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Build a debug APK to prove the app compiles.
      # A dummy Places key is fine for a compile check — no real key is needed in CI.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=PLACES_API_KEY=ci_dummy_key
